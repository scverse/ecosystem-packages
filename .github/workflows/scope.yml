# PRs adding a package may only touch `packages/` (editing existing packages alongside other changes is fine).
# `pull_request_target` runs this file from `main`, so a PR can't edit the check away.
# It never checks out PR code, so it's safe.
name: PR scope

on:
  pull_request_target:

permissions:
  pull-requests: read

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - name: Don’t mix package submissions with other changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | "\(.status) \(.filename)"')
          echo "$files"
          if grep -qE '^added packages/[^/]+/meta\.yaml$' <<<"$files" && grep -qv ' packages/' <<<"$files"; then
            echo "::error::PRs that add a package may only touch files in packages/. Please split out the other changes:"
            grep -v ' packages/' <<<"$files"
            exit 1
          fi

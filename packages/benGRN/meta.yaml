name: benGRN
description: |
  Benchmarking tool for gene network inference from single cell RNAseq methods.
  It uses the grnndata/anndata modality and only contains biological ground truth networks
project_home: https://github.com/jkobject/benGRN
documentation_home: https://www.jkobject.com/benGRN
publications:
  - 10.1038/s41467-025-58699-1
install:
  pypi: bengrn
primary_category: scRNA-seq
tags:
  - scRNA-seq
  - gene regulatory networks
  - benchmarking
license: MIT
language: Python
version: v1.2.1
contact:
  - jkobject
test_command: pip install . && make test
category: ecosystem

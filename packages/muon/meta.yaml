name: Muon
description: |
  muon is a Python framework for multimodal omics analysis. It provides functionality
  for working with multimodal data, including preprocessing, integration, and visualization.
project_home: https://github.com/scverse/muon
documentation_home: https://muon.readthedocs.io/
inventory: https://muon.readthedocs.io/stable/
tutorials_home: https://muon-tutorials.readthedocs.io/
publications:
  - 10.1186/s13059-021-02577-8
install:
  pypi: muon
  conda: conda-forge::muon
primary_category: Multimodal
tags:
  - multimodal
  - data integration
license: BSD-3-Clause
language: Python
contact:
  - gtca
logo: logo.svg
test_command: pip install ".[test]" && pytest
category: core-framework

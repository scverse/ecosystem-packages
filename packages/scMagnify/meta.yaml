name: scMagnify
description: |
  A computational framework for inferring and decomposing multi-scale dynamic
  gene regulatory networks (GRNs) from single-cell multi-omic datasets using
  nonlinear Granger causality and tensor decomposition.
project_home: https://github.com/LiHongCSBLab/scMagnify
documentation_home: https://scmagnify.readthedocs.io/
tutorials_home: https://scmagnify.readthedocs.io/page/tutorials/index.html
publications:
  - 10.1038/s41467-026-78441-9
install:
  pypi: scmagnify
primary_category: Multimodal
tags:

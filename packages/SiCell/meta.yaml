name: SiCell
description: SiCell.jl is a Julia-native toolkit for end-to-end single-cell RNA-seq
  analysis, including quality control, normalization, dimensionality reduction, clustering,
  differential expression, cell-type annotation, batch alignment, and trajectory analysis.
  Its optional Muon.jl extension enables conversion between SiCell's native analysis
  object and AnnData, preserving supported annotations, layers, embeddings, pairwise
  annotations, and unstructured metadata.
project_home: https://github.com/Sizerta/SiCell.jl
documentation_home: https://sizerta.github.io/SiCell.jl/
tutorials_home: https://sizerta.github.io/SiCell.jl/tutorials.html

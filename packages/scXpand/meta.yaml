name: scXpand
description: |
  scXpand is a machine learning framework for pan-cancer detection of T-cell clonal expansion
  directly from single-cell RNA sequencing (scRNA-seq), without paired T-cell receptor (TCR) sequencing.
project_home: https://github.com/yizhak-lab-ccg/scXpand
documentation_home: https://scxpand.readthedocs.io/
tutorials_home: https://scxpand.readthedocs.io/
publications:
  - 10.1101/2025.09.14.676069
install:
  pypi: scxpand
primary_category: Adaptive immune cell receptor
tags:
  - scRNA-seq
  - immune receptor
  - deep learning
license: MIT
language: Python
contact:
  - ronamit
  - ofirshorer
  - yizhak-lab-ccg
test_command: |
  pip install -e ".[dev]" && pytest --cov=src.scxpand tests
category: ecosystem

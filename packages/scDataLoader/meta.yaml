name: scDataLoader
description: |
  A dataloader for large single cell databases like cellxgene.
  Does weighted random sampling, downloading and preprocessing.
  works with anndata, zarr, and h5ad files.
project_home: https://github.com/jkobject/scDataLoader
documentation_home: https://www.jkobject.com/scDataLoader/
inventory: https://www.jkobject.com/scDataLoader/
publications:
  - 10.1038/s41467-025-58699-1
install:
  pypi: scdataloader
primary_category: Infrastructure
tags:
  - scRNA-seq
  - preprocessing
  - deep learning
  - file formats
license: MIT
language: Python
contact:

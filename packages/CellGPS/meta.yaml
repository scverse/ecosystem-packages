name: CellGPS
description: |
  CellGPS is the reference Python implementation of Cophenetic Spatial
  Topology Embedding (COSTE) for spatial omics. It computes searcher-findee
  distance matrices and StructureMap/cophenetic topology from coordinate
  tables and AnnData-backed workflows.
project_home: https://github.com/Moldia/CellGPS
documentation_home: https://github.com/Moldia/CellGPS/tree/main/docs
tutorials_home: https://github.com/Moldia/CellGPS#quick-start-from-a-coordinate-table
inventory: null
publications:

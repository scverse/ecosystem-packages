[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "ecosystem-scripts"
description = "scripts for ecosystem package data"
readme = "README.md"
license = "GPL-3.0"
authors = [
  { name = "Gregor Sturm", email = "gregor.sturm@scverse.org" },
  { name = "Philipp A.", email = "flying-sheep@web.de" },
]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [
  "httpx-limiter[aiolimiter,httpx2]>=0.7",
  "httpx-retries",
  "httpx2",
  "jsonschema>=4.25.1",
  "pillow>=12",
  "pygithub",
  "pyyaml",
  "rich",
]
urls.Documentation = "https://github.com/scverse/ecosystem-packages#readme"
urls.Issues = "https://github.com/scverse/ecosystem-packages/issues"
urls.Source = "https://github.com/scverse/ecosystem-packages"
scripts.register-template-repos = "ecosystem_scripts.template_repo_registry:main"
scripts.validate-registry = "ecosystem_scripts.validate_registry:main"

[dependency-groups]
typing = [ "mypy", "types-jsonschema", "types-pyyaml" ]

[tool.hatch]
version.source = "vcs"
version.fallback-version = "0.0"
envs.hatch-check-types.python = "3.14"
envs.hatch-check-types.installer = "uv"
envs.hatch-check-types.env-vars.UV_OVERRIDE = "{root}/../overrides.txt"
envs.hatch-check-types.scripts.check = "mypy {args:.}"
envs.hatch-check-types.dependency-groups = [ "typing" ]

[tool.ruff]
line-length = 120
lint.select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "RUF",
  "S",
  "T",
  "TC",
  "TID",
  "UP",
  "W",
  "YTT",
]
lint.ignore = []

[tool.mypy]
mypy_path = [ "$MYPY_CONFIG_FILE_DIR/typings", "$MYPY_CONFIG_FILE_DIR/src" ]
explicit_package_bases = true
strict = true
